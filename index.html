<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>無限イライラ棒 - Infinite Wire Frustration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 50%, #0a0a1a 100%);
            font-family: 'Orbitron', 'Arial', sans-serif;
            overflow: hidden;
        }

        #gameContainer {
            text-align: center;
            background: rgba(10, 10, 30, 0.8);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.3), 0 0 80px rgba(138, 43, 226, 0.2);
            border: 2px solid rgba(0, 255, 255, 0.3);
        }

        h1 {
            color: #00ffff;
            margin-bottom: 15px;
            font-size: 32px;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.8),
                         0 0 40px rgba(0, 255, 255, 0.5);
            letter-spacing: 3px;
        }

        #gameCanvas {
            border: 3px solid rgba(138, 43, 226, 0.6);
            border-radius: 10px;
            display: block;
            margin: 0 auto;
            background: #0a0a1a;
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.4) inset,
                        0 0 40px rgba(0, 255, 255, 0.2);
        }

        #score {
            font-size: 28px;
            color: #00ffff;
            margin-top: 15px;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
        }

        #highScore {
            font-size: 20px;
            color: #ff00ff;
            margin-top: 8px;
            text-shadow: 0 0 10px rgba(255, 0, 255, 0.6);
        }

        #instructions {
            margin-top: 15px;
            color: #8a8aff;
            font-size: 14px;
            text-shadow: 0 0 5px rgba(138, 138, 255, 0.5);
        }

        .key {
            display: inline-block;
            padding: 5px 12px;
            background: linear-gradient(135deg, rgba(138, 43, 226, 0.3), rgba(0, 255, 255, 0.3));
            color: #00ffff;
            border-radius: 5px;
            margin: 0 3px;
            font-weight: bold;
            border: 1px solid rgba(0, 255, 255, 0.5);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        #gameContainer {
            animation: pulse 3s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <h1>⚡ 無限イライラ棒 ⚡</h1>
        <canvas id="gameCanvas" width="900" height="600"></canvas>
        <div id="score">距離: 0m</div>
        <div id="highScore">最高記録: 0m</div>
        <div id="instructions">
            <span class="key">矢印キー</span> または <span class="key">マウス</span> で球を操作 |
            <span class="key">R</span> でリスタート
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');

        // ゲーム状態
        let gameRunning = false;
        let gameOver = false;
        let score = 0;
        let highScore = localStorage.getItem('wireHighScore') || 0;
        let frameCount = 0;
        let gameSpeed = 3;
        let baseSpeed = 3;

        // プレイヤー（球）
        const player = {
            x: 150,
            y: canvas.height / 2,
            radius: 12,
            targetX: 150,
            targetY: canvas.height / 2,
            speed: 0.15,
            trail: [],
            trailLength: 15,

            draw: function() {
                // 軌跡を描画
                for (let i = 0; i < this.trail.length; i++) {
                    const alpha = i / this.trail.length;
                    const radius = this.radius * alpha;
                    const gradient = ctx.createRadialGradient(
                        this.trail[i].x, this.trail[i].y, 0,
                        this.trail[i].x, this.trail[i].y, radius
                    );
                    gradient.addColorStop(0, `rgba(0, 255, 255, ${alpha * 0.6})`);
                    gradient.addColorStop(0.5, `rgba(138, 43, 226, ${alpha * 0.4})`);
                    gradient.addColorStop(1, 'rgba(0, 255, 255, 0)');

                    ctx.beginPath();
                    ctx.arc(this.trail[i].x, this.trail[i].y, radius, 0, Math.PI * 2);
                    ctx.fillStyle = gradient;
                    ctx.fill();
                }

                // 外側のグロー
                const outerGlow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius * 2.5);
                outerGlow.addColorStop(0, 'rgba(0, 255, 255, 0.5)');
                outerGlow.addColorStop(0.5, 'rgba(138, 43, 226, 0.3)');
                outerGlow.addColorStop(1, 'rgba(0, 255, 255, 0)');

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * 2.5, 0, Math.PI * 2);
                ctx.fillStyle = outerGlow;
                ctx.fill();

                // 球本体
                const gradient = ctx.createRadialGradient(
                    this.x - this.radius * 0.3,
                    this.y - this.radius * 0.3,
                    0,
                    this.x,
                    this.y,
                    this.radius
                );
                gradient.addColorStop(0, '#ffffff');
                gradient.addColorStop(0.3, '#00ffff');
                gradient.addColorStop(0.7, '#8a2be2');
                gradient.addColorStop(1, '#4a0e78');

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();

                // 内側のハイライト
                ctx.beginPath();
                ctx.arc(this.x - this.radius * 0.3, this.y - this.radius * 0.3, this.radius * 0.4, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.fill();
            },

            update: function() {
                // スムーズに目標位置に移動
                const dx = this.targetX - this.x;
                const dy = this.targetY - this.y;
                this.x += dx * this.speed;
                this.y += dy * this.speed;

                // 軌跡を更新
                this.trail.push({x: this.x, y: this.y});
                if (this.trail.length > this.trailLength) {
                    this.trail.shift();
                }
            }
        };

        // 障害物（棒）
        class Wire {
            constructor() {
                this.x = canvas.width;
                this.gapY = Math.random() * (canvas.height - 250) + 125;
                this.gapSize = Math.max(140 - Math.floor(score / 100) * 5, 100); // スコアに応じてギャップが狭くなる
                this.width = 8;
                this.passed = false;
                this.hue = Math.random() * 60 + 280; // 紫〜青の範囲
            }

            draw() {
                const gradient1 = ctx.createLinearGradient(this.x - 5, 0, this.x + 5, 0);
                gradient1.addColorStop(0, `hsla(${this.hue}, 100%, 50%, 0)`);
                gradient1.addColorStop(0.5, `hsla(${this.hue}, 100%, 70%, 1)`);
                gradient1.addColorStop(1, `hsla(${this.hue}, 100%, 50%, 0)`);

                // 上の棒
                ctx.shadowBlur = 20;
                ctx.shadowColor = `hsla(${this.hue}, 100%, 70%, 0.8)`;
                ctx.fillStyle = gradient1;
                ctx.fillRect(this.x - this.width / 2, 0, this.width, this.gapY - this.gapSize / 2);

                // 下の棒
                ctx.fillRect(this.x - this.width / 2, this.gapY + this.gapSize / 2, this.width, canvas.height);
                ctx.shadowBlur = 0;

                // 棒の端にグロー効果
                const endGlow = ctx.createRadialGradient(this.x, this.gapY - this.gapSize / 2, 0, this.x, this.gapY - this.gapSize / 2, 20);
                endGlow.addColorStop(0, `hsla(${this.hue}, 100%, 70%, 0.8)`);
                endGlow.addColorStop(1, `hsla(${this.hue}, 100%, 70%, 0)`);
                ctx.fillStyle = endGlow;
                ctx.fillRect(this.x - 20, this.gapY - this.gapSize / 2 - 5, 40, 10);

                const endGlow2 = ctx.createRadialGradient(this.x, this.gapY + this.gapSize / 2, 0, this.x, this.gapY + this.gapSize / 2, 20);
                endGlow2.addColorStop(0, `hsla(${this.hue}, 100%, 70%, 0.8)`);
                endGlow2.addColorStop(1, `hsla(${this.hue}, 100%, 70%, 0)`);
                ctx.fillStyle = endGlow2;
                ctx.fillRect(this.x - 20, this.gapY + this.gapSize / 2 - 5, 40, 10);
            }

            update() {
                this.x -= gameSpeed;
            }

            isOffScreen() {
                return this.x + this.width < 0;
            }

            collidesWith(player) {
                const distance = Math.sqrt(Math.pow(player.x - this.x, 2) + Math.pow(player.y - this.gapY, 2));

                // 上の棒との衝突
                if (player.x + player.radius > this.x - this.width / 2 &&
                    player.x - player.radius < this.x + this.width / 2 &&
                    player.y - player.radius < this.gapY - this.gapSize / 2) {
                    return true;
                }

                // 下の棒との衝突
                if (player.x + player.radius > this.x - this.width / 2 &&
                    player.x - player.radius < this.x + this.width / 2 &&
                    player.y + player.radius > this.gapY + this.gapSize / 2) {
                    return true;
                }

                return false;
            }
        }

        let wires = [];
        let nextWireDistance = 250;
        let distanceTraveled = 0;

        // 背景のスター描画
        const stars = [];
        for (let i = 0; i < 100; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2,
                speed: Math.random() * 0.5 + 0.2
            });
        }

        function drawStars() {
            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.5 + 0.5})`;
                ctx.fill();

                star.x -= star.speed * gameSpeed;
                if (star.x < 0) {
                    star.x = canvas.width;
                    star.y = Math.random() * canvas.height;
                }
            });
        }

        // グリッド描画
        function drawGrid() {
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            const gridSize = 40;
            const offset = (frameCount * gameSpeed * 0.5) % gridSize;

            for (let x = -offset; x < canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }

            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }

        // ゲームオーバー画面
        function drawGameOver() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // ゲームオーバーテキスト
            ctx.shadowBlur = 30;
            ctx.shadowColor = 'rgba(255, 0, 100, 0.8)';
            ctx.fillStyle = '#ff0066';
            ctx.font = 'bold 56px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 40);

            ctx.shadowBlur = 20;
            ctx.shadowColor = 'rgba(0, 255, 255, 0.8)';
            ctx.fillStyle = '#00ffff';
            ctx.font = '28px Arial';
            ctx.fillText(`距離: ${score}m`, canvas.width / 2, canvas.height / 2 + 20);

            if (score >= highScore) {
                ctx.shadowColor = 'rgba(255, 215, 0, 0.8)';
                ctx.fillStyle = '#ffd700';
                ctx.font = 'bold 32px Arial';
                ctx.fillText('★ NEW RECORD ★', canvas.width / 2, canvas.height / 2 + 70);
            }

            ctx.shadowBlur = 10;
            ctx.fillStyle = '#8a8aff';
            ctx.font = '20px Arial';
            ctx.fillText('Rキーでリスタート', canvas.width / 2, canvas.height / 2 + 120);
            ctx.shadowBlur = 0;
        }

        // スタート画面
        function drawStartScreen() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.shadowBlur = 30;
            ctx.shadowColor = 'rgba(0, 255, 255, 0.8)';
            ctx.fillStyle = '#00ffff';
            ctx.font = 'bold 36px Arial';
            ctx.textAlign = 'center';

            const pulse = Math.sin(frameCount * 0.05) * 0.2 + 1;
            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.scale(pulse, pulse);
            ctx.fillText('クリックしてスタート!', 0, 0);
            ctx.restore();

            ctx.shadowBlur = 0;
        }

        // ゲームループ
        function gameLoop() {
            // 背景
            const bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGradient.addColorStop(0, '#0a0a1a');
            bgGradient.addColorStop(0.5, '#1a0a2a');
            bgGradient.addColorStop(1, '#0a0a1a');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 星とグリッドを描画
            drawStars();
            drawGrid();

            if (gameRunning && !gameOver) {
                frameCount++;
                distanceTraveled += gameSpeed;

                // スコア更新（10フレームごとに1m）
                if (frameCount % 10 === 0) {
                    score++;
                    scoreElement.textContent = `距離: ${score}m`;
                }

                // スピードアップ（100mごとに0.3加速）
                if (frameCount % 1000 === 0) {
                    gameSpeed = Math.min(baseSpeed + Math.floor(score / 100) * 0.3, 10);
                }

                // プレイヤーの更新と描画
                player.update();
                player.draw();

                // 障害物の生成
                if (distanceTraveled >= nextWireDistance) {
                    wires.push(new Wire());
                    nextWireDistance = distanceTraveled + Math.floor(Math.random() * 100) + 200;
                }

                // 障害物の更新と描画
                for (let i = wires.length - 1; i >= 0; i--) {
                    wires[i].update();
                    wires[i].draw();

                    // 衝突判定
                    if (wires[i].collidesWith(player)) {
                        gameOver = true;
                        if (score > highScore) {
                            highScore = score;
                            localStorage.setItem('wireHighScore', highScore);
                            highScoreElement.textContent = `最高記録: ${highScore}m`;
                        }
                    }

                    // 画面外に出たか確認
                    if (wires[i].isOffScreen()) {
                        wires.splice(i, 1);
                    }
                }

                // 壁との衝突判定
                if (player.y - player.radius < 0 || player.y + player.radius > canvas.height) {
                    gameOver = true;
                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem('wireHighScore', highScore);
                        highScoreElement.textContent = `最高記録: ${highScore}m`;
                    }
                }

                if (gameOver) {
                    drawGameOver();
                }
            } else {
                player.draw();
                if (!gameOver) {
                    drawStartScreen();
                } else {
                    // 障害物も描画
                    wires.forEach(wire => wire.draw());
                    drawGameOver();
                }
            }

            requestAnimationFrame(gameLoop);
        }

        // マウス操作
        canvas.addEventListener('mousemove', (e) => {
            if (gameRunning && !gameOver) {
                const rect = canvas.getBoundingClientRect();
                player.targetX = e.clientX - rect.left;
                player.targetY = e.clientY - rect.top;
            }
        });

        canvas.addEventListener('click', (e) => {
            if (!gameRunning && !gameOver) {
                gameRunning = true;
            } else if (gameOver) {
                restartGame();
            }
        });

        // キーボード操作
        const keys = {};
        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;

            if (e.code === 'KeyR') {
                e.preventDefault();
                restartGame();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        // キーボードでの移動
        setInterval(() => {
            if (gameRunning && !gameOver) {
                const moveSpeed = 8;
                if (keys['ArrowUp']) player.targetY = Math.max(player.radius, player.targetY - moveSpeed);
                if (keys['ArrowDown']) player.targetY = Math.min(canvas.height - player.radius, player.targetY + moveSpeed);
                if (keys['ArrowLeft']) player.targetX = Math.max(player.radius, player.targetX - moveSpeed);
                if (keys['ArrowRight']) player.targetX = Math.min(canvas.width - player.radius, player.targetX + moveSpeed);
            }
        }, 1000 / 60);

        // ゲームのリスタート
        function restartGame() {
            gameRunning = true;
            gameOver = false;
            score = 0;
            frameCount = 0;
            gameSpeed = baseSpeed;
            wires = [];
            nextWireDistance = 250;
            distanceTraveled = 0;
            player.x = 150;
            player.y = canvas.height / 2;
            player.targetX = 150;
            player.targetY = canvas.height / 2;
            player.trail = [];
            scoreElement.textContent = '距離: 0m';
        }

        // 最高得点を表示
        highScoreElement.textContent = `最高記録: ${highScore}m`;

        // ゲーム開始
        gameLoop();
    </script>
</body>
</html>
